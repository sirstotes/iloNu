<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="../keyboard/keyboard.css">
    <link rel="stylesheet" href="style.css">
    <script src="../keyboard/keyboard.js"></script>
    <script src="script.js"></script>
    <title>ilo Nu</title>
    <link rel="icon" href="../images/icon192.png" type="image/x-icon">
    <link rel="canonical" href="https://sirstotes.github.io/iloNu/">
    <link rel="manifest" href="../manifest.json">
</head>
<body>
    <header>
        <button id="settings" onclick="toggleHidden(document.getElementById('toolbar'))">ilo</button>
        <button id="new" onclick="newTab();">en</button>
        <!-- <button id="save"><span>sin</span></button> -->
    </header>
    <div id="toolbar" class="toolbar scrollbar-hide">
        <span>ale</span>
        <button onclick="toggleDarkMode()">suno</button>
        <select onchange="setWebsiteFont(this.value)">
            <option style="font-family: 'Linjamanka';" value="Linjamanka">linja lipamanka</option>
            <option style="font-family: 'Fairfax';" value="Fairfax">Fairfax</option> <!--TODO: make fairfax remove border radiuses-->
            <option style="font-family: 'Fairfax HD';" value="Fairfax HD">FairfaxHD</option>
            <option style="font-family: 'nasin nanpa';" value="nasin nanpa">nasin nanpa</option>
        </select>
        <button onclick="toggleHidden(document.getElementById('keyboard_container'))">nena</button>
        <span>lipu</span>
        <button onclick="decreaseFontSize()">lili</button>
        <button onclick="increaseFontSize()">suli</button>
        <select onchange="setInputColor(this.value)">
            <option onclick="setInputColor('')">kule linja</option>
            <option style="color: var(--loje);" value="var(--loje)">linja loje</option>
            <option style="color: var(--jelo);" value="var(--jelo)">linja jelo</option>
            <option style="color: var(--laso);" value="var(--laso)">linja laso</option>
            <option style="color: var(--pimeja);" value="var(--pimeja)">linja pimeja</option>
            <option style="color: var(--walo);" value="var(--walo)">linja walo</option>
        </select>
        <select onchange="setInputHighlight(this.value)">
            <option value="">kule monsi</option>
            <option style="background-color: var(--loje);" value="var(--loje)">monsi loje</option>
            <option style="background-color: var(--jelo);" value="var(--jelo)">monsi jelo</option>
            <option style="background-color: var(--laso);" value="var(--laso)">monsi laso</option>
            <option style="background-color: var(--pimeja);color:var(--walo);" value="var(--pimeja)">monsi pimeja</option>
            <option style="background-color: var(--walo);" value="var(--walo)">monsi walo</option>
        </select>
        <span>jelo</span>
        <button onclick="copySelection()">tu</button>
        <button onclick="cutSelection()">jo</button>
        <button onclick="pasteFromClipboard()">pana</button>
    </div>
    <main id="textarea" class="textarea scrollbar-hide"></main>
    <div id="keyboard_container"><div id="keyboard" class="keyboard"></div></div>
    <script>
        setKeyboard(document.getElementById('keyboard'), UCSURRows);
        setupTextarea(document.getElementById('textarea'), () => document.getElementById('current_tab') != undefined);
        const request = indexedDB.open("MyDatabase", 1);//Open database
        request.onerror = (event) => {
            console.log("Error loading database");
            document.getElementById('textarea').innerHTML = 'pakala: mi ken ala lukin e lipu.';
            document.getElementById('new').remove();
        };
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            const fileStore = db.createObjectStore('files', { autoIncrement: true });
        };
        request.onsuccess = (event) => {
            console.log('Database loaded');
            const db = event.target.result;

            loadTabs(db.transaction('files', 'readonly').objectStore('files'), db);

            if(document.getElementById('save') != undefined) {
                document.getElementById('save').addEventListener('click', (event) => {
                    console.log('Saving')
                    saveTabs(db.transaction('files', 'readwrite').objectStore('files'));
                    loadTabs(db.transaction('files', 'readonly').objectStore('files'), db);
                });
            }
            window.addEventListener("beforeunload", (event) => {
                saveTabs(db.transaction('files', 'readwrite').objectStore('files'));
                localStorage.setItem('darkMode', getDarkMode());
                localStorage.setItem('siteFont', getWebsiteFont());
                localStorage.setItem('fontSize', getFontSize());
                localStorage.setItem('toolbarHidden', getHidden(document.getElementById('toolbar')));
                localStorage.setItem('keyboardHidden', getHidden(document.getElementById('keyboard_container')));
            });
            window.setInterval(() => {
                if (Array.from(document.getElementsByClassName('tab_name')).some(e => e.style.fontStyle == 'italic')) {
                    let cursorParent = getCursor().parentElement;
                    let cursorIndex;
                    if(cursorParent) {
                        cursorIndex = Array.from(cursorParent.childNodes).indexOf(getCursor());
                    }
                    let selection = Array.from(document.getElementsByClassName('selected'));

                    saveTabs(db.transaction('files', 'readwrite').objectStore('files'));
                    if(cursorParent) {
                        moveCursorInto(cursorParent, cursorIndex);
                    }
                    selection.forEach(e => e.classList.add('selected'));
                }
            }, 10000);//Autosave every 60 seconds
        };
        if (navigator.storage && navigator.storage.persist) {
            navigator.storage.persist();
        }

        setDarkMode(localStorage.getItem('darkMode') == 'true');
        setWebsiteFont(localStorage.getItem('siteFont') || 'Linjamanka')
        setFontSize(localStorage.getItem('fontSize') || 25);
        setHidden(document.getElementById('toolbar'), localStorage.getItem('toolbarHidden') == 'true');
        setHidden(document.getElementById('keyboard_container'), localStorage.getItem('keyboardHidden') == 'true');
    
        document.getElementById('settings').style.width = document.getElementById('settings').getBoundingClientRect().height+"px";
        document.getElementById('new').style.width = document.getElementById('new').getBoundingClientRect().height+"px";
    </script>
    <script>
        if (navigator.serviceWorker) {
          navigator.serviceWorker.register (
            '/iloNu/sw.js',
            {scope: '/iloNu/'}
          )
        }
    </script>
</body>
